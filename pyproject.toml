[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issuesmith"
version = "0.84.1"
description = "GitHub Issue label-driven workflow framework on ghdag"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "ruamel.yaml",
    "packaging",
    "python-dotenv",
]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
ghdag = ["ghdag @ git+https://github.com/sumipan/ghdag.git@v0.72.0"]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
  "ghdag @ git+https://github.com/sumipan/ghdag.git@v0.72.0",
]

[project.scripts]
issuesmith = "issuesmith.cli:main"

[project.urls]
Repository = "https://github.com/sumipan/issuesmith"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
issuesmith = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/issuesmith/gate_rules/**" = ["E501"]
"src/issuesmith/queue.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
files = ["src/issuesmith"]

[[tool.mypy.overrides]]
module = ["ghdag", "ghdag.*", "yaml", "yaml.*"]
ignore_missing_imports = true

# TODO(#3612): cli.py imports the removed ops.label_hygiene; the error code differs between a
# clean checkout (import-not-found) and a machine with an older install (import-untyped), so a
# per-line ignore cannot be kept unused-free. Drop this block with the import.
[[tool.mypy.overrides]]
module = ["issuesmith.ops.label_hygiene"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["issuesmith"]
omit = ["*/__main__.py"]
