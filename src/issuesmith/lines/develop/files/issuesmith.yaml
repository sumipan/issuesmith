repo: example/reference-host
supported_repos:
  - example/reference-host
label_namespace: issuesmith
paths:
  workflow: workflows/issuesmith.yml
  template_dir: workflows/develop/prompts
  worktrees_dir: .worktrees
engines:
  implementation:
    heavy: [[cursor, auto]]
    timeout_sec: 3600
  review:
    heavy: [[cursor, auto]]
    timeout_sec: 1800
phases:
  - name: develop
    role: implementation
    entry_step: prepare
    handler: develop
    steps: [prepare, implement, verify, review, merge]
    advance_when: [deps_terminal]
terminal_labels: [issuesmith:develop-done]
steps:
  prepare:
    module: issuesmith.lines.develop.prepare
    requires: [deps, design_lint, ac_format, scope_coupling, allow_paths_forbidden, scope_breadth]
  implement:
    module: issuesmith.lines.develop.implement
    template: implement.md
  verify:
    module: issuesmith.lines.develop.verify
    requires: [base_freshness, lint, tests, pr_scope, ac_contract]
    input_kind: worktree
    repair:
      max: 2
  review:
    module: issuesmith.lines.develop.review
    requires: [review]
    input_kind: worktree
    repair:
      max: 2
    review:
      role: review
      template: review.md
      success_status: REVIEW_PASS
      failure_status: REVIEW_FAIL
      optional_variables: [issue_body, diff]
  merge:
    module: issuesmith.lines.develop.merge
  repair:
    module: issuesmith.lines.develop.implement
    template: implement.md