name: develop
template_dir: templates
polling_interval: 60
label_namespace: issuesmith
reset_label: "issuesmith:reset"

triggers:
  - label: "issuesmith:develop-ready"
    handler: develop
  - label: "issuesmith:reset"
    handler: reset

handlers:
  develop:
    context_hook: "python3 -m issuesmith context"
    steps:
      - id: prepare
        template: prepare
        engine: shell
        model: bash
      - id: implement
        template: implement
        engine: shell
        model: bash
        depends: [prepare]
      - id: verify
        template: verify
        engine: shell
        model: bash
        depends: [implement]
      - id: review
        template: review
        engine: shell
        model: bash
        depends: [verify]
      - id: merge
        template: merge
        engine: shell
        model: bash
        depends: [review]

  reset:
    type: reset